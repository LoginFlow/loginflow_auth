name: loginflow_auth_google
description: >-
  Optional native Google sign-in for loginflow_auth: obtains a Google ID token
  with the server nonce through Credential Manager (Android) and GoogleSignIn
  (iOS), so apps without Google do not depend on any Google SDK.
version: 0.6.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  loginflow_auth:
    path: ../..

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.loginflow.auth.google
        pluginClass: LoginFlowAuthGooglePlugin
      ios:
        pluginClass: LoginFlowAuthGooglePlugin
